<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#0c0b13" />
<meta name="description" content="창작용 가상 휴대폰 화면" />
<title>휴대폰</title>
<style>
:root {color-scheme: light; --ink:#17171e; --muted:#8b8d98; --line:#e9e9ed; --purple:#7061bd; --bg:#f8f8fb; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Noto Sans KR",sans-serif;}
* {box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html, body {margin:0; min-height:100%;}
body {background:radial-gradient(ellipse at 55% 30%,#29233f 0%,#141521 49%,#090c12 100%); min-height:100dvh; display:grid; place-items:center; padding:28px 16px;}
body::before {content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 10% 18%,rgba(138,89,169,.15),transparent 35%),radial-gradient(circle at 88% 87%,rgba(112,94,167,.15),transparent 30%);}
.phone {width:390px;height:min(844px,calc(100dvh - 56px));min-height:560px;max-width:100%;position:relative;isolation:isolate;background:#11121b;border:7px solid #101116;border-radius:52px;overflow:hidden;box-shadow:0 0 0 1px #3e3d43,0 5px 0 1px #050507,0 30px 90px rgba(0,0,0,.62),inset 0 0 0 1px rgba(255,255,255,.08);}
.phone::after {content:"";position:absolute;inset:0;z-index:3;border:1px solid rgba(255,255,255,.09);border-radius:44px;pointer-events:none;}
.wallpaper {position:absolute;inset:0;pointer-events:none;overflow:hidden;background:linear-gradient(160deg,#131524 2%,#29213a 35%,#4e3c59 57%,#1d192a 86%,#12121f 100%);}
.wallpaper:before {content:"";position:absolute;left:-35%;top:2%;width:165%;height:90%;border-radius:40% 58% 33% 66%;transform:rotate(-23deg);background:radial-gradient(ellipse at 22% 60%,rgba(249,173,192,.46),transparent 35%),radial-gradient(ellipse at 60% 65%,rgba(190,149,224,.42),transparent 40%),radial-gradient(ellipse at 70% 10%,rgba(79,85,153,.39),transparent 52%);filter:blur(35px);}
.wallpaper:after {content:"";position:absolute;left:-30%;top:29%;width:155%;height:64%;border-radius:50% 40% 80% 37%;transform:rotate(-37deg);border:62px solid rgba(193,153,213,.17);filter:blur(26px);box-shadow: 0 0 35px 5px rgba(236,184,205,.1), inset 0 0 45px rgba(241,216,245,.1);}
.phone.is-app {background:var(--bg);}
.phone.is-app .wallpaper {display:none;}
.status {position:absolute;top:0;left:0;right:0;height:56px;z-index:15;display:flex;align-items:center;justify-content:space-between;padding:0 31px 3px 28px;color:white;font-weight:700;font-size:15px;letter-spacing:-.3px;user-select:none;pointer-events:none;}
.phone.is-app .status {color:#1d1e27;}
.status-right {display:flex;gap:6px;align-items:center;}
.status-right svg {width:17px;height:17px;display:block;}
.status-right .wifi {width:17px;}
.battery {height:13px;width:27px;position:relative;border:1.7px solid currentColor;border-radius:4px;opacity:.94;margin-left:2px;}
.battery:before {content:"";position:absolute;background:currentColor;width:2px;height:5px;right:-4px;top:2.4px;border-radius:0 2px 2px 0;}
.battery .charge {position:absolute;left:2px;top:2px;bottom:2px;width:50%;background:currentColor;border-radius:1.8px;}
.island {position:absolute;z-index:16;pointer-events:none;width:116px;height:33px;background:#050508;top:9px;left:50%;transform:translateX(-50%);border-radius:24px;box-shadow:inset 0 -1px 2px rgba(255,255,255,.08);}
.island:after {content:"";position:absolute;right:12px;top:13px;width:7px;height:7px;border-radius:50%;background:#131726;box-shadow:inset 0 0 0 1.2px #1f2633;}
.viewport {position:absolute;inset:54px 0 16px;z-index:5;overflow:hidden;}
.home {height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:0 18px 85px;animation:fade .28s ease both;}
.app-grid {display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:8px;row-gap:26px;align-items:start;}
.app-button {appearance:none;border:0;background:none;padding:0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px;color:#fff;font-family:inherit;font-size:12px;font-weight:500;line-height:1.2;text-shadow:0 1px 4px rgba(0,0,0,.65);cursor:pointer;}
.app-button:active .app-icon {transform:scale(.9);}
.app-icon {display:grid;place-items:center;width:62px;height:62px;border-radius:15px;box-shadow:0 5px 16px rgba(0,0,0,.17),inset 0 1px rgba(255,255,255,.3);overflow:hidden;transition:transform .16s;}
.app-icon svg {width:43px;height:43px;}
.ico-photos{background:linear-gradient(135deg,#fff,#edeef2)}
.ico-contacts{background:linear-gradient(135deg,#d1d4df,#f6f6fa)}
.ico-calls{background:linear-gradient(140deg,#4bdb7e,#12a94f)}
.ico-messages{background:linear-gradient(140deg,#56d886,#1ab452)}
.ico-maps{background:linear-gradient(160deg,#eeeef3,#fff)}
.ico-music{background:linear-gradient(145deg,#f56e9f,#a148b5)}
.ico-notes{background:linear-gradient(180deg,#ffd76e 0 19%,#fff 19% 100%)}
.home-bottom-glow {position:absolute;left:0;right:0;bottom:50px;height:82px;opacity:.25;filter:blur(25px);background:radial-gradient(ellipse at center,rgba(212,181,238,.34),transparent 70%);pointer-events:none;}
.home-indicator {position:absolute;z-index:20;bottom:7px;width:118px;height:5px;border:0;border-radius:50px;background:rgba(255,255,255,.91);left:50%;transform:translateX(-50%);cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.1);}
.phone.is-app .home-indicator {background:#22222a;}
.app-page {height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);animation:screenin .23s cubic-bezier(.2,.7,.3,1) both;}
.app-page.dark {background:#101018;color:white;}
.app-header {display:flex;align-items:center;gap:10px;min-height:61px;padding:2px 19px 5px;flex:none;}
.app-header .header-title {font-size:18px;font-weight:760;letter-spacing:-.7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.back {appearance:none;display:flex;align-items:center;gap:3px;padding:8px 7px 8px 0;color:#7261b8;border:0;background:none;cursor:pointer;font-family:inherit;font-size:15px;font-weight:600;line-height:1;white-space:nowrap;min-width:54px;}
.back svg {width:17px;height:22px;stroke:currentColor;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.right-space {min-width:48px;}
.scroll {flex:1;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;padding-bottom:18px;}
.scroll::-webkit-scrollbar {display:none;}
.section-head {padding:16px 23px 13px;}
.section-head h1 {font-size:30px;letter-spacing:-1.4px;font-weight:780;margin:0 0 4px;}
.section-head p {font-size:12px;color:var(--muted);margin:0;}
.pill {color:#6a5bb2;font-size:12px;font-weight:700;}
.photo-grid {display:grid;grid-template-columns:repeat(2,1fr);gap:5px;padding:0 8px;}
.photo-tile {appearance:none;display:block;aspect-ratio:1 / 1;padding:0;margin:0;overflow:hidden;border:0;border-radius:7px;background:#ddd;cursor:pointer;}
.photo-tile img {width:100%;height:100%;display:block;object-fit:cover;transition:transform .2s ease;}
.photo-tile:active img {transform:scale(1.04);}
.photo-detail {height:100%;background:#101014;display:flex;flex-direction:column;}
.photo-detail .app-header {color:#fff;justify-content:space-between;}
.photo-detail .back {color:#d9ceff;}
.photo-detail .img-space {flex:1;min-height:0;display:grid;place-items:center;}
.photo-detail img {max-width:100%;max-height:100%;object-fit:contain;display:block;}
.photo-foot {display:flex;align-items:center;justify-content:center;gap:24px;height:82px;color:#dedbe9;}
.photo-foot button {background:#272630;color:#fff;border:0;width:42px;height:42px;border-radius:50%;font-size:26px;cursor:pointer;}
.photo-foot button:disabled {opacity:.25;cursor:default;}
.group {background:white;margin:9px 15px;border-radius:17px;overflow:hidden;box-shadow:0 3px 15px rgba(28,22,60,.03);}
.person-row,.note-row,.call-row,.chat-row,.fav-row,.music-row {appearance:none;width:100%;border:0;background:none;text-align:left;display:flex;align-items:center;cursor:pointer;position:relative;color:inherit;font:inherit;}
.person-row,.call-row,.chat-row {padding:13px 16px;gap:13px;min-height:69px;}
.person-row:not(:last-child):after,.call-row:not(:last-child):after,.chat-row:not(:last-child):after,.note-row:not(:last-child):after {content:"";height:1px;background:#f0f0f4;position:absolute;bottom:0;left:68px;right:0;}
.person-row:active,.chat-row:active,.note-row:active,.call-row:active {background:#f5f2fb;}
.avatar {width:43px;height:43px;flex:none;display:grid;place-items:center;border-radius:50%;font-size:21px;font-weight:720;color:#6559a3;background:linear-gradient(140deg,#eae5fc,#d8daed);}
.avatar.pink {background:linear-gradient(145deg,#fae5ec,#e8e0ef);color:#b0698c;}
.avatar.dark {background:linear-gradient(145deg,#d5d6de,#edeefa);color:#5c6071;}
.row-main {display:flex;flex-direction:column;gap:3px;flex:1;min-width:0;}
.name {font-size:16px;font-weight:650;letter-spacing:-.35px;}
.preview {font-size:13px;color:#9b9da8;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.chevron {color:#bec0ca;font-size:23px;font-weight:300;}
.contact-profile {height:100%;display:flex;flex-direction:column;align-items:center;padding:65px 20px;gap:13px;}
.contact-profile .avatar {width:96px;height:96px;font-size:40px;}
.contact-profile h2 {font-size:27px;font-weight:720;margin:0;}
.contact-profile .hint {color:#a5a5b3;font-size:13px;}
.call-row {min-height:60px;}
.call-row .avatar {width:35px;height:35px;font-size:17px;background:#f0eef8;}
.call-row .name {font-size:15px;}
.call-icon {font-size:17px;color:#a5a6b1;margin:0 6px;}
.call-time {font-size:13px;color:#9a9ba6;font-variant-numeric:tabular-nums;}
.chat-row {min-height:76px;}
.thread {display:flex;flex-direction:column;gap:12px;padding:22px 15px 22px;}
.bubble {max-width:78%;padding:12px 14px;border-radius:18px;font-size:15px;line-height:1.55;letter-spacing:-.25px;word-break:keep-all;}
.bubble.in {align-self:flex-start;border-bottom-left-radius:5px;background:#e8e8ed;color:#1d1d22;}
.bubble.out {align-self:flex-end;border-bottom-right-radius:5px;background:#7465be;color:white;}
.chat-spacer {flex:1;min-height:100px;}
.thread-top {text-align:center;display:flex;flex-direction:column;align-items:center;gap:5px;margin:6px 0 23px;}
.thread-top .avatar {width:63px;height:63px;font-size:31px;}
.thread-top .name {font-size:17px;}
.fav-row {min-height:75px;padding:13px 17px;gap:14px;cursor:default;}
.fav-symbol {width:45px;height:45px;border-radius:15px;background:#ece8fb;display:grid;place-items:center;color:#8a6fbc;}
.fav-symbol svg {width:25px;height:25px;stroke:currentColor;}
.music-row {padding:15px;gap:13px;cursor:default;}
.album-art {width:62px;height:62px;border-radius:12px;flex:none;display:grid;place-items:center;background:linear-gradient(145deg,#8f6f90,#454166 55%,#221d34);color:#fff;box-shadow:0 4px 12px rgba(53,30,71,.15);}
.album-art svg {width:35px;height:35px;}
.note-row {padding:17px 17px 17px 19px;gap:13px;min-height:65px;}
.note-row:not(:last-child):after {left:59px;}
.note-symbol {width:26px;height:28px;border-radius:5px;background:linear-gradient(to bottom,#ffd978 0 29%,#fff4cd 29% 100%);box-shadow:0 0 0 1px #f6e5b8;flex:none;}
.note-row .name {font-size:15px;font-weight:600;}
.note-detail {padding:31px 23px;min-height:100%;background:#fffefb;}
.note-detail h2 {font-size:25px;font-weight:730;line-height:1.45;margin:5px 0 0;}
.music-banner {margin:10px 17px 18px;border-radius:19px;background:linear-gradient(135deg,#e8dcea,#f7e9ef);height:142px;display:grid;place-items:center;color:#997bb2;position:relative;overflow:hidden;}
.music-banner:before,.music-banner:after {content:"";position:absolute;border-radius:50%;width:200px;height:200px;border:35px solid rgba(255,255,255,.3);transform:rotate(25deg);left:-40px;top:10px;}
.music-banner:after {left:auto;right:-110px;top:-110px;}
.music-banner svg {position:relative;z-index:2;width:51px;height:51px;}
.small-caps {padding:17px 23px 5px;color:#8e8d9b;font-size:11px;font-weight:750;letter-spacing:1.8px;}
.note-muted {color:var(--muted);font-size:12px;}
@keyframes screenin {from {opacity:.5;transform:translateX(9px)}to{opacity:1;transform:translateX(0)}}
@keyframes fade {from{opacity:.4}to{opacity:1}}
@media(max-width:540px){
 html,body {height:100%;min-height:100dvh;}body{padding:36px 0 0;display:block;background:#111;}
 .phone {width:100%;max-width:none;height:calc(100dvh - 36px);min-height:0;border:0;border-radius:0;box-shadow:none;}
 .phone::after{display:none;}.island{top:8px;}
 .viewport {bottom:max(16px,env(safe-area-inset-bottom));}
 .home-indicator{bottom:max(7px, env(safe-area-inset-bottom));}
 .home {padding-bottom:95px;}
 .app-icon {width:min(62px,16vw);height:min(62px,16vw);}
}
@media (max-height:680px) {.home{padding-bottom:53px;}.app-grid{row-gap:17px;}.app-icon{width:56px;height:56px;}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;}}
</style>
</head>
<body>
<div class="phone" id="phone">
 <div class="wallpaper" aria-hidden="true"></div>

  <span>10:00</span>
  <div class="status-right">
   <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><rect x="1" y="13" width="3" height="5" rx=".7"/><rect x="6" y="10" width="3" height="8" rx=".7"/><rect x="11" y="6" width="3" height="12" rx=".7"/><rect x="16" y="2" width="3" height="16" rx=".7"/></svg>

 </div>

 <main class="viewport" id="viewport"></main>
 <button class="home-indicator" id="home-indicator" aria-label="홈 화면으로 이동" title="홈 화면으로 이동"></button>
</div>

function avatar(name) {
 let variant = name==='여자친구'?'pink':name==='🐰'?'': 'dark';
 let letters = name==='🐰'?'🐰':name==='여자친구'?'♥':name.slice(0,1);
 return `<span class="avatar ${variant}">${letters}</span>`;
}
function go(page,data=null) {state.page=page;state.data=data;render();}
function back() {switch(state.page) {case 'home':break;case 'photo':go('photos');break;case 'thread':go('messages');break;case 'contact':go('contacts');break;case 'note':go('notes');break;default:go('home');}}
function header(title, backLabel='홈') {return `<header class="app-header"><button class="back" data-back aria-label="${backLabel}으로 돌아가기">${islandBack}<span>${backLabel}</span></button><div class="header-title">${title}</div><div class="right-space"></div></header>`;}
function wrap(title,body,dark=false,backLabel='홈') {return `<div class="app-page ${dark?'dark':''}">${header(title,backLabel)}${body}</div>`;}
function home() {return `<div class="home"><div class="home-bottom-glow"></div><div class="app-grid">${apps.map(([id,title])=>`<button class="app-button" data-go="${id}" aria-label="${title} 열기"><span class="app-icon ico-${id}">${icons[id]}</span><span>${title}</span></button>`).join('')}</div></div>`;}
function photos() {return wrap('사진첩',`<section class="scroll"><div class="section-head"><h1>사진첩</h1><p>사진 4장</p></div><div class="photo-grid">${images.map((im,i)=>`<button class="photo-tile" data-photo="${i}" aria-label="${i+1}번째 사진 크게 보기"><img src="${im}" alt="사진 ${i+1}" loading="eager"/></button>`).join('')}</div></section>`);}
function photo() {let i=state.data||0;return `<div class="photo-detail">${header(`사진 ${i+1} / 4`,'사진첩')}<div class="img-space"><img src="${images[i]}" alt="선택한 사진 ${i+1}"/></div><div class="photo-foot"><button data-photo="${i-1}" ${i===0?'disabled':''} aria-label="이전 사진">‹</button><span>${i+1} / 4</span><button data-photo="${i+1}" ${i===3?'disabled':''} aria-label="다음 사진">›</button></div></div>`;}
function contacts() {return wrap('연락처',`<div class="scroll"><div class="section-head"><h1>연락처</h1><p>4명</p></div><div class="group">${contactNames.map((n,i)=>`<button class="person-row" data-contact="${i}">${avatar(n)}<span class="row-main"><span class="name">${n}</span></span><span class="chevron">›</span></button>`).join('')}</div></div>`);}
function contact() {const n=contactNames[state.data]||'';return wrap(n,`<div class="scroll"><div class="contact-profile">${avatar(n)}<h2>${n}</h2><span class="hint">연락처</span></div></div>`,false,'연락처');}
function calls() {return wrap('최근통화',`<div class="scroll"><div class="section-head"><h1>최근 통화</h1><p>최근 항목 · 13개</p></div><div class="group">${callNames.map((n,i)=>`<div class="call-row">${avatar(n)}<span class="row-main"><span class="name">${n}</span></span><span class="call-time">${times[i]}</span></div>`).join('')}</div></div>`);}
function messages() {return wrap('메시지',`<div class="scroll"><div class="section-head"><h1>메시지</h1><p>대화 2개</p></div><div class="group"><button class="chat-row" data-thread="girlfriend">${avatar('여자친구')}<span class="row-main"><span class="name">여자친구</span><span class="preview">어디야</span></span><span class="chevron">›</span></button><button class="chat-row" data-thread="rabbit">${avatar('🐰')}<span class="row-main"><span class="name">🐰</span><span class="preview">나 지금 집인데</span></span><span class="chevron">›</span></button></div></div>`);}
function thread() {const rabbit=state.data==='rabbit',n=rabbit?'🐰':'여자친구'; return wrap(n,`<div class="scroll"><div class="thread"><div class="thread-top">${avatar(n)}<span class="name">${n}</span></div><div class="bubble in">${rabbit?'어디야?':'어디야'}</div>${rabbit?'<div class="bubble out">나 지금 집인데</div>':''}<div class="chat-spacer"></div></div></div>`,false,'메시지');}
function maps() {return wrap('길찾기',`<div class="scroll"><div class="section-head"><h1>길찾기</h1><p>저장된 장소</p></div><div class="small-caps">즐겨찾기</div><div class="group"><div class="fav-row"><span class="fav-symbol">${mapGlyph}</span><span class="row-main"><span class="name">🐰집</span></span><span class="chevron">★</span></div></div></div>`);}
function music() {return wrap('노래듣기',`<div class="scroll"><div class="section-head"><h1>노래듣기</h1><p>노래 1곡</p></div><div class="music-banner" aria-hidden="true">${icons.music}</div><div class="small-caps">보관함</div><div class="group"><div class="music-row"><span class="album-art">${icons.music}</span><span class="row-main"><span class="name">tuki - 만찬가</span></span></div></div></div>`);}
function notes() {return wrap('메모장',`<div class="scroll"><div class="section-head"><h1>메모장</h1><p>메모 4개</p></div><div class="group">${noteNames.map((n,i)=>`<button class="note-row" data-note="${i}"><span class="note-symbol"></span><span class="row-main"><span class="name">${n}</span></span><span class="chevron">›</span></button>`).join('')}</div></div>`);}
function note() {let n=noteNames[state.data]||'';return wrap('메모장',`<div class="scroll"><div class="note-detail"><h2>${n}</h2></div></div>`,false,'메모장');}
const screens={home,photos,photo,contacts,contact,calls,messages,thread,maps,music,notes,note};

viewport.addEventListener('click',(event)=>{
 const b=event.target.closest('button');if(!b || b.disabled) return;
 if(b.hasAttribute('data-back')) return back();
 if(b.dataset.go) return go(b.dataset.go);
 if(b.dataset.photo!==undefined) return go('photo',Number(b.dataset.photo));
 if(b.dataset.contact!==undefined) return go('contact',Number(b.dataset.contact));
 if(b.dataset.thread) return go('thread',b.dataset.thread);
 if(b.dataset.note!==undefined) return go('note',Number(b.dataset.note));
});
document.querySelector('#home-indicator').addEventListener('click',()=>go('home'));
document.addEventListener('keydown',(e)=>{
 if(e.key==='Escape'||e.key==='Backspace'){if(e.target instanceof HTMLInputElement)return;e.preventDefault();back();}
 if(state.page==='photo'&&e.key==='ArrowLeft'&&state.data>0)go('photo',state.data-1);
 if(state.page==='photo'&&e.key==='ArrowRight'&&state.data<3)go('photo',state.data+1);
});
render();
</script>
</body>
</html>
